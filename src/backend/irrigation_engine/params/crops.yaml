# Crop parameters for the FAO-56 water balance.
#
# ============================================================================
# VERIFICATION STATUS
#
# Kc, Zr, p and, where an Indian row exists, stage lengths were checked against
# the printed FAO-56 tables, read from the FAO publication itself:
#
#   Table 11 and Table 12  https://www.fao.org/4/x0490e/x0490e0b.htm  (Chapter 6)
#   Table 22               https://www.fao.org/4/x0490e/x0490e0e.htm  (Chapter 8)
#
# Verification is recorded PER FIELD, not per crop, because a crop can have a
# confirmed Kc and an unconfirmed stage length. Each crop carries a `verified`
# block saying exactly which of its fields were read off the printed table.
# Nothing is marked verified that was not actually checked.
#
# --- HOW TO READ TABLE 12, and the error it caused --------------------------
#
# Table 12 is organised into lettered GROUPS. Kc_ini is printed on the GROUP
# HEADER row, and an individual crop row leaves that cell BLANK unless the crop
# overrides it. A blank Kc_ini therefore means "inherit the group value", not
# "not stated".
#
#   a. Small Vegetables         Kc_ini 0.7
#   b. Vegetables - Solanaceae  Kc_ini 0.6
#   e. Legumes (Leguminosae)    Kc_ini 0.4
#   g. Fibre Crops              Kc_ini 0.35
#   i. Cereals                  Kc_ini 0.3
#
# On 3 September 2026 this structure was misread: Cotton's blank cell was taken
# as a printed 0.30 and its correct seeded value of 0.35 was "corrected" to it,
# introducing an error. Reverted on 3 September 2026. The trail is recorded here
# and in docs/PHASE2_BUILD_LOG.md rather than quietly tidied away, because a
# correction that was itself wrong is exactly the kind of thing that otherwise
# survives into a report.
#
# --- LIMITATION ON EVERY Kc_ini VALUE BELOW ---------------------------------
#
# FAO-56 Chapter 6 states: "The values for Kc ini in Table 12 are only
# approximations and should only be used for estimating ETc during preliminary
# or planning studies." More accurate estimates come from the chapter's
# wetting-frequency method, which accounts for wetting interval, evaporative
# demand and the size of each wetting event.
#
# That method is NOT implemented. Kc_ini therefore carries a known accuracy
# limitation on every crop here, and it is the initial stage, when the canopy is
# sparse and evaporation from the soil surface dominates, that is most affected.
# TODO [VERIFY] implement the wetting-frequency method, or state this limitation
# in the report. Phase-III item.
#
# --- STILL UNVERIFIED, AND WHY ----------------------------------------------
#
#   stage_days  Verified for wheat and maize, which have printed Indian rows in
#               Table 11. Every other crop's row is from a non-Indian region and
#               stays false. FAO-56 itself says Table 11 values "are useful only
#               as a general guide and for comparison purposes" and recommends
#               local observation of plant stage development wherever possible,
#               so even the verified Indian rows are a starting point rather
#               than a substitute for field observation.
#
#   ky          FAO-33 (Doorenbos and Kassam 1979) and FAO-66 (Steduto et al.
#               2012) are separate publications and were not reachable in this
#               session. Ky DOES NOT APPEAR IN FAO-56, so no amount of reading
#               FAO-56 can confirm it.
# ============================================================================

# True only when every field of every crop below is verified. It is not.
verified_all: false

# --- Sources, and what each is the authority for ------------------------------
#
#   FAO-56  Allen, Pereira, Raes and Smith, FAO Irrigation and Drainage Paper
#           56, 1998. Plan reference R20.
#             Table 11  lengths of crop development stages
#             Table 12  single time-averaged crop coefficients Kc
#             Table 22  maximum effective rooting depth Zr, depletion fraction p
#
#   FAO-33  Doorenbos and Kassam, FAO Irrigation and Drainage Paper 33, 1979.
#           Plan reference R24. Source of the yield response factor Ky.
#
#   FAO-66  Steduto, Hsiao, Fereres and Raes, FAO Irrigation and Drainage Paper
#           66, 2012. Plan reference R25. Updated stage-wise Ky.
#
# --- Conventions --------------------------------------------------------------
# Where Table 22 prints a Zr RANGE, the LOWER bound is taken. A shallower root
# zone gives a smaller TAW, so the engine irrigates earlier and in smaller doses,
# which is the conservative direction under a rationed supply.
#
# Where Table 12 prints a Kc_end RANGE, the endpoint matching the management
# practice is taken and the choice is stated in the comment. No mid-range value
# is invented: every figure below is a printed one.
#
# Two footnotes are easy to conflate and are NOT interchangeable:
#   footnote 10 (wheat)  the HIGHER Kc_end is for hand-harvested crops
#   footnote 11 (maize)  the FIRST Kc_end is for harvest at high grain moisture,
#                        the SECOND for harvest after complete field drying
#
# Units: stage_days in calendar days, kc dimensionless, root_depth_m in metres,
# depletion_fraction dimensionless, ky dimensionless.

crops:

  wheat:
    display_name: Wheat
    # FAO-56 Table 12, "Winter Wheat", which prints its own Kc_ini rather than
    # inheriting the Cereals group value: 0.4 on frozen soils, 0.7 on non-frozen.
    # Indian rabi wheat is non-frozen, so 0.7.
    kc_initial: 0.70
    kc_mid: 1.15
    # Table 12 prints the range 0.25 to 0.4. Footnote 10: the HIGHER value is for
    # hand-harvested crops. Smallholder rabi wheat in the pilot districts is
    # frequently hand-harvested, so 0.4.
    #
    # A previous comment here attributed 0.25 to "harvest after complete field
    # drying". That is footnote 11, which belongs to maize, not wheat. Corrected
    # on 3 September 2026.
    kc_end: 0.40
    # FAO-56 Table 11, "Barley/Oats/Wheat", 15/25/50/30, total 120 days, planted
    # November, CENTRAL INDIA. A printed Indian row, so this is verified.
    # Replaces a Mediterranean row previously used for want of an Indian one.
    stage_days:
      initial: 15
      development: 25
      mid: 50
      late: 30
    # FAO-56 Table 22, Winter Wheat: Zr 1.5-1.8 m, p 0.55. Lower bound taken.
    root_depth_m: 1.50
    root_depth_initial_m: 0.15
    depletion_fraction: 0.55
    ky: 1.00  # TODO [VERIFY] FAO-33, winter wheat, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: true, ky: false }

  maize:
    display_name: Maize
    # FAO-56 Table 12, "Maize, Field (grain)". Kc_ini cell is blank, so it
    # inherits the Cereals group header value of 0.3.
    kc_initial: 0.30
    kc_mid: 1.20
    # Table 12 prints 0.60 to 0.35. Footnote 11: the FIRST value is for harvest
    # at high grain moisture, the SECOND for harvest after complete field drying
    # to about 18 percent. Indian grain maize is field-dried, so 0.35.
    kc_end: 0.35
    # FAO-56 Table 11, "Maize (grain)", 20/35/40/30, total 125 days, planted
    # October, INDIA (dry, cool). A printed Indian row, so this is verified.
    stage_days:
      initial: 20
      development: 35
      mid: 40
      late: 30
    # FAO-56 Table 22, Maize (grain): Zr 1.0-1.7 m, p 0.55. Lower bound taken.
    root_depth_m: 1.00
    root_depth_initial_m: 0.15
    depletion_fraction: 0.55
    ky: 1.25  # TODO [VERIFY] FAO-33, maize, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: true, ky: false }

  rice:
    display_name: Rice
    # FAO-56 Table 12, "Rice", which prints its own Kc_ini of 1.05 rather than
    # inheriting the Cereals group value. It is high because a paddy is ponded,
    # so the surface is open water for much of the initial stage.
    kc_initial: 1.05
    kc_mid: 1.20
    # Table 12 prints 0.90 to 0.60. 0.60 is taken: Indian paddy is normally
    # drained before harvest, and a drained field transpires less than a ponded
    # one.
    kc_end: 0.60
    # FAO-56 Table 11, "30 30 60 30" for December/May, tropics and Mediterranean.
    # No Indian row for rice, so this stays unverified.
    stage_days:
      initial: 30      # TODO [VERIFY] Indian kharif transplanted paddy
      development: 30  # TODO [VERIFY]
      mid: 60          # TODO [VERIFY]
      late: 30         # TODO [VERIFY]
    # FAO-56 Table 22, Rice: Zr 0.5-1.0 m, p 0.20. Lower bound taken.
    root_depth_m: 0.50
    root_depth_initial_m: 0.10
    depletion_fraction: 0.20
    ky: 1.09  # TODO [VERIFY] FAO-66, rice; FAO-33 gives a different figure
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }
    # Rice is normally grown ponded rather than to a depletion trigger. The water
    # balance still runs, but a ponded-paddy mode is a Phase-III item.
    notes: "TODO [VERIFY] ponded paddy management differs from a depletion-triggered balance"

  cotton:
    display_name: Cotton
    # FAO-56 Table 12, "Cotton". The Kc_ini cell is BLANK, so cotton inherits the
    # Fibre Crops group header value of 0.35.
    #
    # This value was wrongly "corrected" to 0.30 on 3 September 2026 by reading
    # the blank cell as a printed value. Reverted the same day. See the header.
    kc_initial: 0.35
    # Table 12 prints 1.15 to 1.20. Lower bound taken.
    kc_mid: 1.15
    # Table 12 prints 0.70 to 0.50. 0.70 applies at the first picking, falling
    # toward 0.50 by the last; the first picking is taken.
    kc_end: 0.70
    # FAO-56 Table 11, "30 50 60 55" for March to May, Egypt, Pakistan and
    # California. No Indian row for cotton, so this stays unverified.
    stage_days:
      initial: 30      # TODO [VERIFY] Maharashtra kharif cotton
      development: 50  # TODO [VERIFY]
      mid: 60          # TODO [VERIFY]
      late: 55         # TODO [VERIFY]
    # FAO-56 Table 22, Cotton: Zr 1.0-1.7 m, p 0.65. Lower bound taken.
    root_depth_m: 1.00
    root_depth_initial_m: 0.15
    depletion_fraction: 0.65
    ky: 0.85  # TODO [VERIFY] FAO-33, cotton, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

  sugarcane:
    display_name: Sugarcane
    # FAO-56 Table 12, "Sugar Cane", which prints its own Kc_ini of 0.40.
    kc_initial: 0.40
    kc_mid: 1.25
    kc_end: 0.75
    # FAO-56 Table 11, "35 60 190 120" for low latitudes, virgin cane. No Indian
    # row, so this stays unverified.
    stage_days:
      initial: 35       # TODO [VERIFY] Indian adsali or suru planting
      development: 60   # TODO [VERIFY]
      mid: 190          # TODO [VERIFY]
      late: 120         # TODO [VERIFY]
    # FAO-56 Table 22, Sugar Cane: Zr 1.2-2.0 m, p 0.65. Lower bound taken.
    root_depth_m: 1.20
    root_depth_initial_m: 0.20
    depletion_fraction: 0.65
    ky: 1.20  # TODO [VERIFY] FAO-33, sugarcane, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

  groundnut:
    display_name: Groundnut
    # FAO-56 Table 12, "Groundnut (Peanut)". The Kc_ini cell is BLANK, so it
    # inherits the Legumes (Leguminosae) group header value of 0.4.
    #
    # A previous note here said Kc_ini "could not be resolved because of the
    # footnote markers". That was a misreading of the group structure; the value
    # is printed, on the group header row. Corrected on 3 September 2026 and this
    # field now flips to verified.
    kc_initial: 0.40
    kc_mid: 1.15
    kc_end: 0.60
    # FAO-56 Table 11, "25 35 45 25" for the dry season, West Africa. No Indian
    # row, so this stays unverified.
    stage_days:
      initial: 25      # TODO [VERIFY] Indian kharif groundnut
      development: 35  # TODO [VERIFY]
      mid: 45          # TODO [VERIFY]
      late: 25         # TODO [VERIFY]
    # FAO-56 Table 22, Groundnut (Peanut): Zr 0.5-1.0 m, p 0.50. Lower bound.
    root_depth_m: 0.50
    root_depth_initial_m: 0.10
    depletion_fraction: 0.50
    ky: 0.70  # TODO [VERIFY] FAO-33, groundnut, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

  tomato:
    display_name: Tomato
    # FAO-56 Table 12, "Tomato". The Kc_ini cell is BLANK, so it inherits the
    # Vegetables - Solanaceae group header value of 0.6.
    kc_initial: 0.60
    kc_mid: 1.15
    # Table 12 prints 0.70 to 0.90. The chapter's rule is that a crop irrigated
    # frequently and harvested fresh keeps a wet topsoil and takes the HIGHER
    # value, while a crop left to senesce and dry in the field takes the LOWER
    # one. Indian fresh-market tomato is picked over several harvests and stays
    # irrigated, so 0.90.
    #
    # A previous comment had this rule inverted and selected 0.70. Corrected on
    # 3 September 2026. 0.90 is also the conservative direction, consistent with
    # the lower-bound convention adopted for Zr.
    kc_end: 0.90
    # FAO-56 Table 11, "30 40 40 25" for January, arid region. No Indian row, so
    # this stays unverified.
    stage_days:
      initial: 30      # TODO [VERIFY] Indian transplanted tomato
      development: 40  # TODO [VERIFY]
      mid: 40          # TODO [VERIFY]
      late: 25         # TODO [VERIFY]
    # FAO-56 Table 22, Tomato: Zr 0.7-1.5 m, p 0.40. Lower bound taken.
    root_depth_m: 0.70
    root_depth_initial_m: 0.10
    depletion_fraction: 0.40
    ky: 1.05  # TODO [VERIFY] FAO-33, tomato, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

  onion:
    display_name: Onion
    # FAO-56 Table 12, "Onion, dry". The Kc_ini cell is BLANK, so it inherits the
    # Small Vegetables group header value of 0.7.
    kc_initial: 0.70
    kc_mid: 1.05
    kc_end: 0.75
    # FAO-56 Table 11, "15 25 70 40" for April, Mediterranean. No Indian row, so
    # this stays unverified.
    stage_days:
      initial: 15      # TODO [VERIFY] Indian rabi onion
      development: 25  # TODO [VERIFY]
      mid: 70          # TODO [VERIFY]
      late: 40         # TODO [VERIFY]
    # FAO-56 Table 22, Onions - dry: Zr 0.3-0.6 m, p 0.30. Lower bound taken.
    # The shallowest root zone in this set, so onion tolerates the least delay
    # when a power window is missed. The scheduler's Ky weighting reflects that.
    root_depth_m: 0.30
    root_depth_initial_m: 0.10
    depletion_fraction: 0.30
    ky: 1.10  # TODO [VERIFY] FAO-33, onion, whole growing season
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

  chickpea:
    display_name: Chickpea
    # FAO-56 Table 12, "Chick pea". The Kc_ini cell is BLANK, so it inherits the
    # Legumes (Leguminosae) group header value of 0.4.
    kc_initial: 0.40
    kc_mid: 1.00
    kc_end: 0.35
    # Chick pea does NOT appear in FAO-56 Table 11 at all; this was confirmed
    # against the printed table rather than assumed. These lengths are a
    # plausible Indian rabi chickpea season and are wholly unverified.
    stage_days:
      initial: 20      # TODO [VERIFY] chick pea absent from FAO-56 Table 11
      development: 30  # TODO [VERIFY]
      mid: 40          # TODO [VERIFY]
      late: 20         # TODO [VERIFY]
    # FAO-56 Table 22, Chick pea: Zr 0.6-1.0 m, p 0.50. Lower bound taken.
    root_depth_m: 0.60
    root_depth_initial_m: 0.10
    depletion_fraction: 0.50
    # No confirmed Ky for chickpea. 1.0 is the neutral default: yield loss
    # proportional to water deficit, neither amplified nor damped, so the
    # scheduler neither over- nor under-prioritises this crop against others
    # sharing a pump.
    ky: 1.00  # TODO [VERIFY] not located in FAO-33 or FAO-66; neutral default
    verified: { kc: true, root_depth: true, depletion_fraction: true, stage_days: false, ky: false }

# --- Adjustment applied to every crop ----------------------------------------
# FAO-56 Table 22 accompanying note: the tabulated p applies at an ETc of about
# 5 mm/day and is adjusted for other rates as
#     p_adj = p_table + 0.04 (5 - ETc)
# then clamped. A crop tolerates proportionally less depletion on a high-demand
# day, because the soil cannot deliver water to the roots fast enough.
depletion_adjustment:
  reference_etc_mm: 5.0
  coefficient: 0.04
  min_p: 0.10
  max_p: 0.80
